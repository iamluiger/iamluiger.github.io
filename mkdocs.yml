site_name: Luiger Pages
site_description: Blog y artículos de Luiger sobre tecnología, DevOps, nube híbrida e IA
nav:
    - Inicio: index.md
    - Mi Blog:
        - La Dureza Necesaria - El Desafío de Ser Objetivo Cuando Eres Empático: blog/2026/0304/empatia-objetividad.md
        - La Importancia del Descanso: blog/2026/0201/descanso.md
        - 2026 El año en que debemos estudiar más: blog/2025/1225/estudiar2025.md
        - La AI como parte de nuestro aprendizaje: blog/2024/0809/ai.md
        - Como sacar el pasaporte en el Tachira: blog/2022/2603/pasaporte.md
        - Año Nuevo: blog/2020/0101/nuevo.md
    - Mis articulos:
        - Microservicios: articulos/2019/MicroSOA/micro2soa.md
    - Acerca de mi: about.md

theme:
    name: material
    language: es
    font:
        text: Source Sans 3
        code: JetBrains Mono
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: blue grey
          accent: teal
          toggle:
              icon: material/weather-night
              name: Cambiar a modo oscuro
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: blue grey
          accent: teal
          toggle:
              icon: material/weather-sunny
              name: Cambiar a modo claro
    features:
        - navigation.tabs
        - navigation.top
        - navigation.indexes
        - toc.follow
        - content.code.copy
        - search.highlight

extra_css:
    - stylesheets/extra.css

markdown_extensions:
    - admonition
    - attr_list
    - toc:
          permalink: true
    - pymdownx.highlight
    - pymdownx.superfences
